<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reality TV Release Index</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e2e8f0;
            --primary-color: #0066cc;
            --new-bg: #fff9db;
            --new-border: #ffe066;
            --banner-bg: #edf2f7;
            --banner-text: #718096;
            --li-bg: #f8fafc;
            --link-color: #1a365d;
        }

        [data-theme="dark"] {
            --bg-color: #1a202c;
            --card-bg: #2d3748;
            --text-color: #e2e8f0;
            --border-color: #4a5568;
            --primary-color: #63b3ed;
            --new-bg: #4a3b10;
            --new-border: #b7791f;
            --banner-bg: #2d3748;
            --banner-text: #a0aec0;
            --li-bg: #323f53;
            --link-color: #90cdf4;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px;
            background: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            transition: background 0.3s, color 0.3s;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0 10px 0;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            color: var(--text-color);
            font-size: 1.8rem;
            margin: 0;
            flex-grow: 1;
            text-align: center;
        }

        .header-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-theme, .btn-settings {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: background 0.2s, border-color 0.2s;
        }

        .btn-theme:hover, .btn-settings:hover {
            border-color: var(--primary-color);
        }

        /* Modal / Verwaltungs-Panel für Shows */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h3 {
            margin-top: 0;
            color: var(--primary-color);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
        }

        .form-group input {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
        }

        .btn-add {
            background: #319795;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
        }

        .shows-manage-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
        }

        .shows-manage-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-color);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .btn-delete-show {
            background: #e53e3e;
            color: white;
            border: none;
            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
        }

        .modal-close {
            background: #4a5568;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            text-align: center;
        }

        .update-banner {
            font-size: 0.85rem;
            color: var(--banner-text);
            margin-bottom: 30px;
            background: var(--banner-bg);
            padding: 8px 12px;
            border-radius: 20px;
            display: inline-block;
        }

        .banner-wrapper {
            text-align: center;
        }

        #content {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            #content {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 1024px) {
            #content {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .category {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .category h2 {
            margin-top: 0;
            font-size: 1.25rem;
            color: var(--primary-color);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        ul {
            padding-left: 0;
            list-style: none;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-grow: 1;
        }

        li {
            padding: 12px;
            border-radius: 8px;
            background: var(--li-bg);
            border: 1px solid var(--border-color);
        }

        li.is-new {
            background: var(--new-bg);
            border-color: var(--new-border);
        }

        .item-content {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        a.title-link {
            color: var(--link-color);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            word-break: break-word;
        }

        a.title-link:hover {
            text-decoration: underline;
        }

        .action-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .meta-info {
            font-size: 0.8rem;
            color: var(--banner-text);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .button-group {
            display: flex;
            gap: 6px;
        }

        .btn-download, .btn-copy {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 4px;
            text-decoration: none;
            text-transform: uppercase;
            cursor: pointer;
            border: none;
        }

        .btn-download { background: #319795; color: white; }
        .btn-copy { background: #4a5568; color: white; }

        .badge-new {
            background: #e53e3e;
            color: white;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .error {
            color: #c53030;
            background: #fff5f5;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #feb2b2;
            text-align: center;
        }

        .loading {
            text-align: center;
            color: var(--banner-text);
            font-size: 1.1rem;
            padding: 40px;
        }
    </style>
</head>
<body>

    <header>
        <div style="width: 90px;"></div>
        <h1>Reality TV Release Index</h1>
        <div class="header-buttons">
            <button class="btn-theme" id="theme-toggle" onclick="toggleTheme()">🌙</button>
        </div>
    </header>

    <div class="banner-wrapper">
        <div id="update-info" class="update-banner">Lade Status...</div>
    </div>
    
    <div id="content" class="loading">Lade Daten...</div>

    <script>
        // Dark Mode
        const currentTheme = localStorage.getItem('theme') || 'light';
        if (currentTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.getElementById('theme-toggle').innerText = '☀️';
        }

        function toggleTheme() {
            const theme = document.documentElement.getAttribute('data-theme');
            const toggleBtn = document.getElementById('theme-toggle');
            if (theme === 'dark') {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
                toggleBtn.innerText = '🌙';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                toggleBtn.innerText = '☀️';
            }
        }

        // Modal Steuerung
        function openModal() {
            document.getElementById('shows-modal').style.display = 'flex';
            renderManageList();
        }
        function closeModal() {
            document.getElementById('shows-modal').style.display = 'none';
        }

        // Lokale Show-Verwaltung über localStorage
        function getStoredShows() {
            const defaultShows = [
                {name: "Are You The One", url: "https://scnlog.me/?s=are%20you%20the%20one%20reality"},
                {name: "Love Island VIP", url: "https://scnlog.me/?s=Love%20island%20vip%20german"},
                {name: "CoupleChallenge", url: "https://scnlog.me/?s=Couplechallenge"},
                {name: "Temptation Island VIP", url: "https://scnlog.me/?s=Temptation%20island%20vip%20german"},
                {name: "Sommerhaus", url: "https://scnlog.me/?s=Sommerhaus"},
                {name: "Der Promihof", url: "https://scnlog.me/?s=Der%20Promihof"}
            ];
            const stored = localStorage.getItem('my_shows');
            return stored ? JSON.parse(stored) : defaultShows;
        }

        function renderManageList() {
            const listEl = document.getElementById('shows-manage-list');
            const shows = getStoredShows();
            listEl.innerHTML = '';
            shows.forEach((show, index) => {
                listEl.innerHTML += `<li class="shows-manage-item">
                    <span><strong>${show.name}</strong></span>
                    <button class="btn-delete-show" onclick="deleteShow(${index})">Löschen</button>
                </li>`;
            });
        }

        function addNewShow() {
            const name = document.getElementById('new-show-name').value.trim();
            const url = document.getElementById('new-show-url').value.trim();
            if(!name || !url) {
                alert('Bitte Name und URL eingeben!');
                return;
            }
            const shows = getStoredShows();
            shows.push({name, url});
            localStorage.setItem('my_shows', JSON.stringify(shows));
            document.getElementById('new-show-name').value = '';
            document.getElementById('new-show-url').value = '';
            renderManageList();
            alert('Show hinzugefügt! (Vergiss nicht, sie auch in deiner shows.html auf GitHub einzutragen, damit der Scraper sie abruft).');
        }

        function deleteShow(index) {
            const shows = getStoredShows();
            shows.splice(index, 1);
            localStorage.setItem('my_shows', JSON.stringify(shows));
            renderManageList();
        }

        // Kopieren in Zwischenablage
        function copyToClipboard(text, buttonElement) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = buttonElement.innerText;
                buttonElement.innerText = "✓ Kopiert!";
                buttonElement.style.background = "#38a169";
                setTimeout(() => {
                    buttonElement.innerText = originalText;
                    buttonElement.style.background = "#4a5568";
                }, 1500);
            });
        }

        // Daten laden und anzeigen
        fetch('data.json?t=' + new Date().getTime())
            .then(response => response.json())
            .then(jsonResponse => {
                const data = jsonResponse.categories || jsonResponse;
                const lastUpdated = jsonResponse.last_updated;

                const updateInfoDiv = document.getElementById('update-info');
                if (lastUpdated) {
                    updateInfoDiv.innerHTML = `🔄 Zuletzt aktualisiert: <strong>${lastUpdated} Uhr</strong>`;
                } else {
                    updateInfoDiv.style.display = 'none';
                }

                const container = document.getElementById('content');
                container.innerHTML = '';
                container.classList.remove('loading');

                const now = new Date();
                const todayStr = now.toISOString().split('T')[0];
                const yesterday = new Date();
                yesterday.setDate(now.getDate() - 1);
                const yesterdayStr = yesterday.toISOString().split('T')[0];

                const sortedCategories = Object.entries(data).sort((a, b) => {
                    const itemsA = a[1];
                    const itemsB = b[1];
                    const dateA = itemsA && itemsA.length > 0 && itemsA[0].datetime ? new Date(itemsA[0].datetime) : new Date(0);
                    const dateB = itemsB && itemsB.length > 0 && itemsB[0].datetime ? new Date(itemsB[0].datetime) : new Date(0);
                    return dateB - dateA;
                });

                for (const [category, items] of sortedCategories) {
                    const div = document.createElement('div');
                    div.className = 'category';
                    
                    let html = `<h2>${category}</h2>`;
                    if (items && items.length > 0) {
                        html += '<ul>';
                        items.forEach(item => {
                            let isNew = false;
                            let dateDisplay = item.datetime || '';

                            if (item.datetime) {
                                const itemDateStr = item.datetime.split(' ')[0]; 
                                if (itemDateStr === todayStr || itemDateStr === yesterdayStr) {
                                    isNew = true;
                                }
                            }

                            const liClass = isNew ? 'is-new' : '';
                            const badge = isNew ? '<span class="badge-new">Neu</span>' : '';
                            const downloadUrl = item.multiup || item.link;

                            html += `<li class="${liClass}">
                                <div class="item-content">
                                    <a class="title-link" href="${item.link}" target="_blank">${item.title}</a>
                                    <div class="action-row">
                                        <div class="meta-info">
                                            ${badge}
                                            <span>📅 ${dateDisplay} Uhr</span>
                                        </div>
                                        <div class="button-group">
                                            <button class="btn-copy" onclick="copyToClipboard('${downloadUrl}', this)">📋 Copy</button>
                                            <a class="btn-download" href="${downloadUrl}" target="_blank">📥 Download</a>
                                        </div>
                                    </div>
                                </div>
                            </li>`;
                        });
                        html += '</ul>';
                    } else {
                        html += '<p style="color: var(--banner-text); font-size: 0.9rem;">Keine aktuellen Einträge (heute/gestern).</p>';
                    }
                    
                    div.innerHTML = html;
                    container.appendChild(div);
                }
            })
            .catch(error => {
                document.getElementById('update-info').style.display = 'none';
                const container = document.getElementById('content');
                container.classList.remove('loading');
                container.innerHTML = `<div class="error">Fehler beim Laden der data.json: ${error.message}</div>`;
            });
    </script>

</body>
</html>
