<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reality Show Updates</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; background: #f4f4f9; color: #333; }
        h1 { text-align: center; color: #444; }
        .category { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .category h2 { margin-top: 0; color: #0066cc; border-bottom: 2px solid #eee; padding-bottom: 8px; }
        ul { padding-left: 0; list-style: none; }
        li { 
            margin-bottom: 12px; 
            padding: 12px; 
            border-radius: 6px; 
            background: #fafafa; 
            border: 1px solid #eee;
            transition: background 0.2s;
        }
        li.is-new {
            background: #fff9db; /* Sanftes Gelb für heute & gestern */
            border-color: #ffe066;
        }
        .item-content { display: flex; flex-direction: column; gap: 4px; }
        a { color: #0056b3; text-decoration: none; font-weight: 500; font-size: 15px; }
        a:hover { text-decoration: underline; }
        .meta-info {
            font-size: 12px;
            color: #666;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .badge-new {
            background: #ff6b6b;
            color: white;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
        }
        .error { color: red; background: #ffe6e6; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>

    <h1>Reality TV Release Index</h1>
    <div id="content">Lade Daten...</div>

    <script>
        fetch('data.json?t=' + new Date().getTime())
            .then(response => {
                if (!response.ok) throw new Error('HTTP-Fehler! Status: ' + response.status);
                return response.json();
            })
            .then(data => {
                const container = document.getElementById('content');
                container.innerHTML = '';

                // Heutiges und gestriges Datum als String ermitteln (YYYY-MM-DD)
                const now = new Date();
                const todayStr = now.toISOString().split('T')[0];

                const yesterday = new Date();
                yesterday.setDate(now.getDate() - 1);
                const yesterdayStr = yesterday.toISOString().split('T')[0];

                for (const [category, items] of Object.entries(data)) {
                    const div = document.createElement('div');
                    div.className = 'category';
                    
                    let html = `<h2>${category}</h2>`;
                    if (items && items.length > 0) {
                        html += '<ul>';
                        items.forEach(item => {
                            let isNew = false;
                            let dateDisplay = item.datetime || '';

                            if (item.datetime) {
                                const itemDateStr = item.datetime.split(' ')[0]; // Nur den Tag YYYY-MM-DD holen
                                
                                // Prüfen, ob das Datum von heute oder gestern ist
                                if (itemDateStr === todayStr || itemDateStr === yesterdayStr) {
                                    isNew = true;
                                }
                            }

                            const liClass = isNew ? 'is-new' : '';
                            const badge = isNew ? '<span class="badge-new">Neu</span>' : '';

                            html += `<li class="${liClass}">
                                <div class="item-content">
                                    <a href="${item.link}" target="_blank">${item.title}</a>
                                    <div class="meta-info">
                                        ${badge}
                                        <span>📅 ${dateDisplay} Uhr</span>
                                    </div>
                                </div>
                            </li>`;
                        });
                        html += '</ul>';
                    } else {
                        html += '<p>Keine Einträge gefunden.</p>';
                    }
                    
                    div.innerHTML = html;
                    container.appendChild(div);
                }
            })
            .catch(error => {
                document.getElementById('content').innerHTML = `<div class="error">Fehler beim Laden der data.json: ${error.message}</div>`;
                console.error('Fehler:', error);
            });
    </script>

</body>
</html>
