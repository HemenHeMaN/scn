<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reality TV Release Index</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e2e8f0;
            --primary-color: #0066cc;
            --new-bg: #fff9db;
            --new-border: #ffe066;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px;
            background: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
        }

        h1 {
            text-align: center;
            color: #2d3748;
            font-size: 1.8rem;
            margin: 20px 0 5px 0;
        }

        .update-banner {
            text-align: center;
            font-size: 0.85rem;
            color: #718096;
            margin-bottom: 30px;
            background: #edf2f7;
            padding: 8px 12px;
            border-radius: 20px;
            display: inline-block;
        }

        .banner-wrapper {
            text-align: center;
        }

        #content {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            #content {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 1024px) {
            #content {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .category {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .category h2 {
            margin-top: 0;
            font-size: 1.25rem;
            color: var(--primary-color);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        ul {
            padding-left: 0;
            list-style: none;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-grow: 1;
        }

        li {
            padding: 12px;
            border-radius: 8px;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            transition: box-shadow 0.1s ease;
        }

        li.is-new {
            background: var(--new-bg);
            border-color: var(--new-border);
        }

        .item-content {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        a.title-link {
            color: #1a365d;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            word-break: break-word;
        }

        a.title-link:hover {
            color: var(--primary-color);
            text-decoration: underline;
        }

        .action-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .meta-info {
            font-size: 0.8rem;
            color: #718096;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-download {
            background: #319795;
            color: white;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 4px;
            text-decoration: none;
            text-transform: uppercase;
            transition: background 0.2s;
        }

        .btn-download:hover {
            background: #2c7a7b;
            text-decoration: none;
        }

        .badge-new {
            background: #e53e3e;
            color: white;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .error {
            color: #c53030;
            background: #fff5f5;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #feb2b2;
            text-align: center;
        }

        .loading {
            text-align: center;
            color: #718096;
            font-size: 1.1rem;
            padding: 40px;
        }
    </style>
</head>
<body>

    <h1>Reality TV Release Index</h1>
    <div class="banner-wrapper">
        <div id="update-info" class="update-banner">Lade Status...</div>
    </div>
    
    <div id="content" class="loading">Lade Daten...</div>

    <script>
        fetch('data.json?t=' + new Date().getTime())
            .then(response => {
                if (!response.ok) throw new Error('HTTP-Fehler! Status: ' + response.status);
                return response.json();
            })
            .then(jsonResponse => {
                const data = jsonResponse.categories || jsonResponse;
                const lastUpdated = jsonResponse.last_updated;

                const updateInfoDiv = document.getElementById('update-info');
                if (lastUpdated) {
                    updateInfoDiv.innerHTML = `🔄 Zuletzt aktualisiert: <strong>${lastUpdated} Uhr</strong>`;
                } else {
                    updateInfoDiv.style.display = 'none';
                }

                const container = document.getElementById('content');
                container.innerHTML = '';
                container.classList.remove('loading');

                const now = new Date();
                const todayStr = now.toISOString().split('T')[0];

                const yesterday = new Date();
                yesterday.setDate(now.getDate() - 1);
                const yesterdayStr = yesterday.toISOString().split('T')[0];

                const sortedCategories = Object.entries(data).sort((a, b) => {
                    const itemsA = a[1];
                    const itemsB = b[1];
                    const dateA = itemsA && itemsA.length > 0 && itemsA[0].datetime ? new Date(itemsA[0].datetime) : new Date(0);
                    const dateB = itemsB && itemsB.length > 0 && itemsB[0].datetime ? new Date(itemsB[0].datetime) : new Date(0);
                    return dateB - dateA;
                });

                for (const [category, items] of sortedCategories) {
                    const div = document.createElement('div');
                    div.className = 'category';
                    
                    let html = `<h2>${category}</h2>`;
                    if (items && items.length > 0) {
                        html += '<ul>';
                        items.forEach(item => {
                            let isNew = false;
                            let dateDisplay = item.datetime || '';

                            if (item.datetime) {
                                const itemDateStr = item.datetime.split(' ')[0]; 
                                if (itemDateStr === todayStr || itemDateStr === yesterdayStr) {
                                    isNew = true;
                                }
                            }

                            const liClass = isNew ? 'is-new' : '';
                            const badge = isNew ? '<span class="badge-new">Neu</span>' : '';
                            const downloadLink = item.multiup || item.link;

                            html += `<li class="${liClass}">
                                <div class="item-content">
                                    <a class="title-link" href="${item.link}" target="_blank">${item.title}</a>
                                    <div class="action-row">
                                        <div class="meta-info">
                                            ${badge}
                                            <span>📅 ${dateDisplay} Uhr</span>
                                        </div>
                                        <a class="btn-download" href="${downloadLink}" target="_blank">📥 Download</a>
                                    </div>
                                </div>
                            </li>`;
                        });
                        html += '</ul>';
                    } else {
                        html += '<p style="color: #718096; font-size: 0.9rem;">Keine aktuellen Einträge (heute/gestern).</p>';
                    }
                    
                    div.innerHTML = html;
                    container.appendChild(div);
                }
            })
            .catch(error => {
                document.getElementById('update-info').style.display = 'none';
                const container = document.getElementById('content');
                container.classList.remove('loading');
                container.innerHTML = `<div class="error">Fehler beim Laden der data.json: ${error.message}</div>`;
                console.error('Fehler:', error);
            });
    </script>

</body>
</html>
