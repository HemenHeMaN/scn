<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reality Show Updates</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; background: #f4f4f9; color: #333; }
        h1 { text-align: center; color: #444; }
        .category { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .category h2 { margin-top: 0; color: #0066cc; border-bottom: 2px solid #eee; padding-bottom: 8px; }
        ul { padding-left: 0; list-style: none; }
        li { 
            margin-bottom: 12px; 
            padding: 10px; 
            border-radius: 6px; 
            background: #fafafa; 
            border: 1px solid #eee;
            transition: background 0.2s;
        }
        li.is-today {
            background: #fff9db; /* Sanftes Gelb für heutige Einträge */
            border-color: #ffe066;
        }
        a { color: #0056b3; text-decoration: none; font-weight: 500; }
        a:hover { text-decoration: underline; }
        .badge-new {
            background: #ff6b6b;
            color: white;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 8px;
            text-transform: uppercase;
        }
        .error { color: red; background: #ffe6e6; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>

    <h1>Reality TV Release Index</h1>
    <div id="content">Lade Daten...</div>

    <script>
        // Heutiges Datum im Format YYYY-MM-DD ermitteln
        const todayStr = new Date().toISOString().split('T')[0];

        fetch('data.json?t=' + new Date().getTime())
            .then(response => {
                if (!response.ok) throw new Error('HTTP-Fehler! Status: ' + response.status);
                return response.json();
            })
            .then(data => {
                const container = document.getElementById('content');
                container.innerHTML = '';

                for (const [category, items] of Object.entries(data)) {
                    const div = document.createElement('div');
                    div.className = 'category';
                    
                    let html = `<h2>${category}</h2>`;
                    if (items && items.length > 0) {
                        html += '<ul>';
                        items.forEach(item => {
                            // Prüfen ob der Eintrag von heute ist
                            const isToday = item.date === todayStr;
                            const liClass = isToday ? 'is-today' : '';
                            const badge = isToday ? '<span class="badge-new">Neu</span>' : '';

                            html += `<li class="${liClass}">
                                ${badge}<a href="${item.link}" target="_blank">${item.title}</a>
                            </li>`;
                        });
                        html += '</ul>';
                    } else {
                        html += '<p>Keine Einträge gefunden.</p>';
                    }
                    
                    div.innerHTML = html;
                    container.appendChild(div);
                }
            })
            .catch(error => {
                document.getElementById('content').innerHTML = `<div class="error">Fehler beim Laden der data.json: ${error.message}</div>`;
                console.error('Fehler:', error);
            });
    </script>

</body>
</html>
