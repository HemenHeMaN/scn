name: Scrape scnlog

on:
  schedule:
    - cron: "0 * * * *"   # Läuft jede Stunde zur vollen Stunde (z.B. 15:00, 16:00, 17:00 usw.)
  workflow_dispatch:       # Erlaubt zusätzlich das manuelle Starten per Klick in GitHub

permissions:
  contents: write          # Verleiht dem Bot die nötigen Schreibrechte für den git push

concurrency:
  group: scrape-workflow
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten (Version 3.12)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 cloudscraper requests

      - name: Scraper ausführen
        run: python scraper.py

      - name: data.json committen und pushen (falls geändert)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "Keine neuen Daten - Commit übersprungen."
          else
            git commit -m "Auto-update data.json ($(date +'%Y-%m-%d %H:%M'))"
            git push
          fi