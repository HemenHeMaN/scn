name: Stündlicher Scraper

on:
  schedule:
    - cron: '0 * * * *'  # Läuft stündlich
  workflow_dispatch:      # Erlaubt manuellen Start in GitHub

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install cloudscraper beautifulsoup4

      - name: Scraper ausführen
        run: python scraper/scraper.py

      - name: Änderungen committen und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Auto-Update der Scraper-Daten [skip ci]" || exit 0
          git push
