name: Scrape scnlog

on:
  workflow_dispatch:       # Lässt sich jederzeit manuell mit einem Klick starten

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 cloudscraper requests

      - name: Scraper ausführen
        run: python scraper.py

      - name: data.json committen und pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "Keine neuen Daten."
          else
            git commit -m "Auto-update data.json"
            git push
          fi
